[package]
name = "oxydeforge"
version = "0.1.0"
description = "Apprendre le Rust en forgeant"
edition = "2021"

# La bibliothèque contient toute l'app ; main.rs ne fait que la lancer.
[lib]
name = "oxydeforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
