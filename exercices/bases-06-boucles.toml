id = "bases-06"
module = "bases"
titre = "Les boucles"
notion = "for, ranges, while et loop"
type = "lecon"

# Kael, technicien de la fonderie : un peu gauche, distrait, jovial et chaleureux.
kael = "Le nouvel apprenti doit connaître sa table de 7 pour régler les engrenages. J'avais promis de la lui imprimer… il y a trois semaines. Oups."

lecon = '''
Rust a **trois** boucles.

**1. `for`** : parcourir une suite de valeurs.

```rust
for i in 1..=5 {
    println!("{i}");    // 1 2 3 4 5
}
```

| Rust | Contient | Python |
|---|---|---|
| `1..5` | 1, 2, 3, 4 (**sans** le 5) | `range(1, 5)` |
| `1..=5` | 1, 2, 3, 4, 5 (**avec** le 5) | `range(1, 6)` |

**2. `while`** : tant qu'une condition est vraie.

```rust
let mut n = 3;
while n > 0 {
    n -= 1;
}
```

**3. `loop`** : pour toujours, jusqu'à un `break`.

```rust
loop {
    break;
}
```

> `n -= 1` : pas de `n--` en Rust, comme en Python. Et n'oublie pas `mut`, sinon E0384 !
'''

mission = '''
Affiche la table de multiplication de 7, de 1 à 10 :

```text
7 x 1 = 7
7 x 2 = 14
…
7 x 10 = 70
```
'''

sortie_attendue = '''
7 x 1 = 7
7 x 2 = 14
7 x 3 = 21
7 x 4 = 28
7 x 5 = 35
7 x 6 = 42
7 x 7 = 49
7 x 8 = 56
7 x 9 = 63
7 x 10 = 70
'''

criteres = [
  "Le programme **compile**",
  "Il affiche les **10 lignes** de la table de 7",
]

indices = [
  "Une boucle `for i in 1..=10 { … }`.",
  "Dans la boucle : `println!(\"7 x {} = {}\", i, 7 * i);`",
]

solution = '''
fn main() {
    for i in 1..=10 {
        println!("7 x {} = {}", i, 7 * i);
    }
}
'''
