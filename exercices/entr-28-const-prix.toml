id = "entr-28"
module = "entrainement"
titre = "Le prix du boulon"
notion = "const f64"
type = "defi"

# Généré par scripts/generer_entrainement.mjs : modifie le générateur, pas ce fichier.
kael = "Le boulon coûte 15 centimes, depuis toujours et pour toujours. Le patron l’a gravé sur le mur. Avec mon front, presque."

lecon = '''
- par exemple `const TVA: f64 = 0.2;` : type **obligatoire**, nom en MAJUSCULES
- une constante se déclare en dehors de `main`
'''

mission = '''
Déclare `PRIX_BOULON` (0.15). Calcule le prix de 120 boulons et affiche-le avec deux décimales.

Résultat attendu :

```text
120 boulons : 18.00 €
```
'''

sortie_attendue = '''
120 boulons : 18.00 €
'''

criteres = ["Le programme **compile**", "Il affiche le **bon texte**"]

indices = ["La quantité est un entier : convertis-la en `f64` avant de la multiplier par le prix."]

solution = '''
const PRIX_BOULON: f64 = 0.15;

fn main() {
    let quantite = 120;
    let total = PRIX_BOULON * quantite as f64;
    println!("{quantite} boulons : {total:.2} €");
}
'''
